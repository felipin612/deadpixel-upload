<!DOCTYPE html><html><head><meta charset="utf-8"><title>bridge</title></head><body><p id="s">Preparando video…</p><script>
(async()=>{const f=location.hash.slice(1);const s=document.getElementById('s');
try{const r=await fetch('v/'+f);if(!r.ok)throw new Error(r.status);const b=await r.blob();
(window.opener||window.parent).postMessage({dpFile:f,blob:b},'https://www.tiktok.com');s.textContent='Enviado ('+b.size+' bytes). Puedes cerrar esta ventana.';setTimeout(()=>window.close(),1500);}
catch(e){s.textContent='Error: '+e.message;}})();
</script></body></html>
