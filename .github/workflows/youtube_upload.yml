name: YouTube episode upload (API, R25)
on:
  push:
    paths: ["jobs/upload/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ytupload
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/youtube_upload_api.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add jobs/upload; git commit -m "YouTube upload results [skip ci]" || exit 0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
