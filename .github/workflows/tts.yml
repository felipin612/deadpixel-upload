name: Narration (Chatterbox, free)
on:
  push:
    paths: ["jobs/tts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
      - run: python tools/tts_chatterbox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-output
          path: |
            samples/
            narration/
          if-no-files-found: ignore
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A jobs/tts samples narration 2>/dev/null || true
          git commit -m "TTS results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
