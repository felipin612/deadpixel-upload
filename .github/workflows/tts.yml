name: Narration (Chatterbox, free)
on:
  push:
    paths: ["jobs/tts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - run: |
          sudo apt-get install -y ffmpeg >/dev/null
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
      - run: python tools/tts_chatterbox.py
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add jobs/tts samples narration 2>/dev/null; git commit -m "TTS results [skip ci]" && git push || true
